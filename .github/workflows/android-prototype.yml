name: Android prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-prototype.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-prototype.yml"

permissions:
  contents: read

concurrency:
  group: android-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify Gradle wrapper
        working-directory: android
        run: |
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f 1)" = "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"

      - name: Test and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: sagesearch-image-test-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
